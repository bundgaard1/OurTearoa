server {
    listen 80 default_server;
    server_name ourtearoa.duckdns.org 54.252.56.209 _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name ourtearoa.duckdns.org 54.252.56.209 _;

    root /var/www/ourtearoa;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/ourtearoa.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ourtearoa.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Backend API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

