name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      # 1. Build Angular on GitHub's Runner
      - name: Build Angular Frontend
        run: |
          cd client
          npm ci
          npx ng build --configuration production

      # 2. Configure SSH Agent
      - name: Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 3. Rsync Built Frontend Directly to /var/www/ourtearoa
      - name: Deploy Frontend to Nginx Web Root
        run: |
          rsync -avz --delete \
            client/dist/client/browser/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/ourtearoa/

      # 4. Update Backend, Run Migrations, and Reload PM2
      - name: Deploy Backend & Restart Services
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            # Navigate to project repo on EC2
            cd /home/ec2-user/OurTearoa

            # Pull latest changes for the backend
            git pull origin main

            # Update backend dependencies & DB schema
            cd backend
            npm ci --omit=dev
            npx prisma migrate deploy

            # Reload backend with zero downtime
            pm2 reload ecosystem.config.js || pm2 reload server || pm2 restart all

            # Restore correct SELinux context on static files
            sudo chcon -Rt httpd_sys_content_t /var/www/ourtearoa
          EOF