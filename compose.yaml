services:
  db:
    image: postgres:16-alpine
    container_name: ourtearoa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ourtearoa
      POSTGRES_PASSWORD: ourtearoa_dev
      POSTGRES_DB: ourtearoa
    ports:
      - "5432:5432"
    volumes:
      - ourtearoa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ourtearoa -d ourtearoa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ourtearoa_pgdata: