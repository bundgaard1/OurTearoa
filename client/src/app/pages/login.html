<section class="form-page">
  <h1>Login</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    @if (submitted() && form.controls.email.hasError('required')) {
      <p class="field-error">Email is required.</p>
    }
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (submitted() && form.controls.password.hasError('required')) {
      <p class="field-error">Password is required.</p>
    }
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }
    <button type="submit" [disabled]="pending()">Log in</button>
  </form>
  <p>New here? <a routerLink="/register">Create an account</a></p>
</section>
