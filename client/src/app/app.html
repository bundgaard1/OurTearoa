<header class="header">
  <a routerLink="/places" class="brand">OurTearoa</a>
  <nav class="nav">
    <a routerLink="/places" routerLinkActive="active">Places</a>
    @if (auth.isAuthenticated()) {
      <a routerLink="/favorites" routerLinkActive="active">Favourites</a>
      <a routerLink="/itinerary" routerLinkActive="active">Itinerary</a>
      <a routerLink="/profile" routerLinkActive="active">{{ auth.user()?.name }}</a>
      <button type="button" (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Login</a>
      <a routerLink="/register" routerLinkActive="active">Register</a>
    }
  </nav>
</header>
<main class="content">
  <router-outlet />
</main>
